<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>光能守护者 - 眼动塔防</title>
    <style>
        /* ===== 全局重置与基础样式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0e27;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        /* ===== 游戏容器 ===== */
        #gameContainer {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* ===== Canvas 游戏画布 ===== */
        #gameCanvas {
            flex: 1;
            display: block;
            touch-action: none;
            image-rendering: pixelated;
            image-rendering: -webkit-optimize-contrast;
        }

        /* ===== 横屏锁定提示 ===== */
        #orientationLock {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1f4b 0%, #0a0e27 100%);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
            text-align: center;
        }

        #orientationLock.show {
            display: flex;
        }

        .rotate-icon {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            animation: rotatePhone 2s ease-in-out infinite;
        }

        @keyframes rotatePhone {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
        }

        .rotate-icon svg {
            width: 100%;
            height: 100%;
            fill: #4facfe;
        }

        #orientationLock h2 {
            color: #fff;
            font-size: 24px;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(79, 172, 254, 0.5);
        }

        #orientationLock p {
            color: #8b92b4;
            font-size: 14px;
            line-height: 1.6;
            max-width: 300px;
        }

        /* ===== 开始界面 ===== */
        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1f4b 0%, #0a0e27 50%, #1a0b2e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        #startScreen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        /* 游戏 Logo */
        .game-logo {
            width: 200px;
            height: 200px;
            margin-bottom: 30px;
            position: relative;
        }

        .logo-outer {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 50%, #4facfe 100%);
            animation: logoPulse 3s ease-in-out infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 60px rgba(79, 172, 254, 0.6);
        }

        @keyframes logoPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 60px rgba(79, 172, 254, 0.6); }
            50% { transform: scale(1.05); box-shadow: 0 0 100px rgba(79, 172, 254, 0.8); }
        }

        .logo-inner {
            width: 70%;
            height: 70%;
            border-radius: 50%;
            background: linear-gradient(135deg, #1a1f4b 0%, #0a0e27 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-icon {
            font-size: 60px;
        }

        /* 游戏标题 */
        .game-title {
            color: #fff;
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(79, 172, 254, 0.8);
            letter-spacing: 4px;
        }

        .game-subtitle {
            color: #8b92b4;
            font-size: 14px;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        /* 开始按钮 */
        .start-btn {
            padding: 18px 60px;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(79, 172, 254, 0.4);
            transition: all 0.3s ease;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
        }

        .start-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s ease;
        }

        .start-btn:hover::before {
            left: 100%;
        }

        .start-btn:active {
            transform: translateY(2px);
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4);
        }

        /* 版本信息 */
        .version-info {
            position: absolute;
            bottom: 20px;
            color: #5a5f7a;
            font-size: 12px;
        }

        /* ===== HUD 界面 ===== */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: none;
            z-index: 100;
        }

        #hud.show {
            display: block;
        }

        /* HUD 顶部栏 */
        .hud-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, transparent 100%);
        }

        .hud-left, .hud-right {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* HUD 信息卡片 */
        .hud-stat {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .hud-stat-icon {
            font-size: 18px;
        }

        .hud-stat-value {
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            min-width: 40px;
            text-align: center;
        }

        .hud-stat-label {
            color: #8b92b4;
            font-size: 12px;
        }

        /* 波次指示器 */
        .wave-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(79, 172, 254, 0.2);
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid rgba(79, 172, 254, 0.4);
        }

        .wave-indicator span {
            color: #4facfe;
            font-weight: bold;
        }

        /* 暂停按钮 */
        .pause-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .pause-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .pause-btn svg {
            width: 20px;
            height: 20px;
            fill: #fff;
        }

        /* HUD 底部控制区 */
        .hud-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            background: linear-gradient(to top, rgba(0,0,0,0.6) 0%, transparent 100%);
            pointer-events: none;
        }

        .hud-controls {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }

        /* 发射按钮 */
        .fire-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b6b 0%, #ff4757 100%);
            border: 4px solid rgba(255, 255, 255, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.1s ease;
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.4);
            position: relative;
            overflow: hidden;
        }

        .fire-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.3s ease, height 0.3s ease;
        }

        .fire-btn:active::before {
            width: 100%;
            height: 100%;
        }

        .fire-btn:active {
            transform: scale(0.95);
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
        }

        .fire-btn svg {
            width: 35px;
            height: 35px;
            fill: #fff;
        }

        /* 技能按钮 */
        .skill-btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            border: 3px solid rgba(255, 255, 255, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.2s ease;
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.3);
            position: relative;
        }

        .skill-btn.cooldown {
            opacity: 0.5;
            pointer-events: none;
        }

        .skill-btn .cooldown-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            transition: height 0.1s linear;
        }

        .skill-btn svg {
            width: 25px;
            height: 25px;
            fill: #fff;
        }

        /* 眼动状态指示器 */
        .eye-status {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: auto;
        }

        .eye-status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff4757;
            animation: eyePulse 2s ease-in-out infinite;
        }

        .eye-status.connected .eye-status-dot {
            background: #2ed573;
        }

        @keyframes eyePulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .eye-status span {
            color: #fff;
            font-size: 12px;
        }

        /* ===== 游戏结束界面 ===== */
        #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            backdrop-filter: blur(10px);
        }

        #gameOverScreen.show {
            display: flex;
        }

        .game-over-title {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        .game-over-title.victory {
            color: #2ed573;
            text-shadow: 0 0 30px rgba(46, 213, 115, 0.8);
        }

        .game-over-title.defeat {
            color: #ff4757;
            text-shadow: 0 0 30px rgba(255, 71, 87, 0.8);
        }

        .final-score {
            color: #fff;
            font-size: 24px;
            margin-bottom: 30px;
        }

        .final-score span {
            color: #4facfe;
            font-weight: bold;
            font-size: 32px;
        }

        .game-over-buttons {
            display: flex;
            gap: 20px;
        }

        .restart-btn, .menu-btn {
            padding: 15px 40px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .restart-btn {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: #fff;
            box-shadow: 0 5px 20px rgba(79, 172, 254, 0.4);
        }

        .menu-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .restart-btn:hover, .menu-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(79, 172, 254, 0.5);
        }

        .restart-btn:active, .menu-btn:active {
            transform: translateY(0);
        }

        /* ===== 暂停菜单 ===== */
        #pauseMenu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1500;
            backdrop-filter: blur(10px);
        }

        #pauseMenu.show {
            display: flex;
        }

        .pause-title {
            color: #fff;
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .pause-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 200px;
        }

        .pause-btn {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .resume-btn {
            background: linear-gradient(135deg, #2ed573 0%, #7bed9f 100%);
            color: #fff;
        }

        .restart-pause-btn {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: #fff;
        }

        .quit-btn {
            background: rgba(255, 71, 87, 0.8);
            color: #fff;
        }

        .pause-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        /* ===== 加载界面 ===== */
        #loadingScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1f4b 0%, #0a0e27 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        #loadingScreen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(79, 172, 254, 0.2);
            border-top-color: #4facfe;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: #4facfe;
            font-size: 16px;
            letter-spacing: 2px;
        }

        .loading-bar {
            width: 200px;
            height: 4px;
            background: rgba(79, 172, 254, 0.2);
            border-radius: 2px;
            margin-top: 15px;
            overflow: hidden;
        }

        .loading-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            border-radius: 2px;
            transition: width 0.3s ease;
            width: 0%;
        }

        /* ===== 触摸反馈动画 ===== */
        .touch-feedback {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(79, 172, 254, 0.6) 0%, transparent 70%);
            pointer-events: none;
            animation: touchRipple 0.4s ease-out forwards;
            z-index: 5000;
        }

        @keyframes touchRipple {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }

        /* ===== 响应式断点 ===== */
        @media (max-width: 480px) {
            .game-title { font-size: 28px; }
            .game-logo { width: 150px; height: 150px; }
            .logo-icon { font-size: 45px; }
            .start-btn { padding: 15px 40px; font-size: 16px; }
            .hud-stat { padding: 6px 12px; }
            .hud-stat-value { font-size: 14px; }
            .fire-btn { width: 70px; height: 70px; }
            .skill-btn { width: 45px; height: 45px; }
        }

        @media (min-width: 768px) {
            .game-title { font-size: 48px; }
            .game-logo { width: 250px; height: 250px; }
            .logo-icon { font-size: 80px; }
            .start-btn { padding: 20px 80px; font-size: 24px; }
        }

        /* ===== 辅助类 ===== */
        .hidden {
            display: none !important;
        }

        .no-select {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
    </style>
</head>
<body>
    <!-- 横屏锁定提示 -->
    <div id="orientationLock">
        <div class="rotate-icon">
            <svg viewBox="0 0 24 24">
                <path d="M16.48 2.52c3.27 1.55 5.61 4.72 5.97 8.48h1.5C23.44 4.84 18.29 0 12 0l-.66.03 3.81 3.81 1.33-1.32zm-6.25-.77c-.26-.17-.48-.4-.62-.65l-1.74 1.74c.64.71 1.56 1.21 2.54 1.42V4.74h-1.18zM4.04 13H2.5c.25 3.77 2.6 6.94 5.86 8.49l1.32-1.32-3.82-3.81-.66.03C5.61 15.47 4.48 14.36 4.04 13zm13.59 6.95l-3.81-3.81 1.32 1.32C18.69 19.95 20.88 18.61 22 16.95v-1.5h-1.5c-.28 1.58-1.08 2.97-2.17 4.03z"/>
            </svg>
        </div>
        <h2>请旋转屏幕</h2>
        <p>为了获得最佳游戏体验，请将手机横屏放置</p>
    </div>

    <!-- 游戏容器 -->
    <div id="gameContainer">
        <!-- 加载界面 -->
        <div id="loadingScreen">
            <div class="loading-spinner"></div>
            <div class="loading-text">加载中...</div>
            <div class="loading-bar">
                <div class="loading-bar-fill" id="loadingBarFill"></div>
            </div>
        </div>

        <!-- 开始界面 -->
        <div id="startScreen">
            <div class="game-logo">
                <div class="logo-outer">
                    <div class="logo-inner">
                        <span class="logo-icon">👁️</span>
                    </div>
                </div>
            </div>
            <h1 class="game-title">光能守护者</h1>
            <p class="game-subtitle">眼动塔防 · Eye Tower Defense</p>
            <button class="start-btn" id="startBtn">开始游戏</button>
            <div class="version-info">v1.0.0</div>
        </div>

        <!-- HUD 界面 -->
        <div id="hud">
            <!-- 顶部信息栏 -->
            <div class="hud-top">
                <div class="hud-left">
                    <div class="hud-stat">
                        <span class="hud-stat-icon">❤️</span>
                        <span class="hud-stat-value" id="healthValue">100</span>
                        <span class="hud-stat-label">生命值</span>
                    </div>
                    <div class="hud-stat">
                        <span class="hud-stat-icon">⭐</span>
                        <span class="hud-stat-value" id="scoreValue">0</span>
                        <span class="hud-stat-label">分数</span>
                    </div>
                </div>
                <div class="hud-right">
                    <div class="wave-indicator">
                        <span>波次:</span>
                        <span id="waveValue">1</span>
                        <span>/</span>
                        <span id="totalWaves">10</span>
                    </div>
                    <button class="pause-btn" id="pauseBtn">
                        <svg viewBox="0 0 24 24">
                            <rect x="6" y="4" width="4" height="16"/>
                            <rect x="14" y="4" width="4" height="16"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- 底部控制区 -->
            <div class="hud-bottom">
                <div class="eye-status" id="eyeStatus">
                    <div class="eye-status-dot"></div>
                    <span>眼动追踪</span>
                </div>
                <div class="hud-controls">
                    <button class="skill-btn" id="skillBtn1" title="激光技能">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 2L2 22h20L12 2zm0 3.5L18.5 19H5.5L12 5.5z"/>
                            <path d="M12 8l-3 8h6l-3-8z" fill="currentColor"/>
                        </svg>
                        <div class="cooldown-overlay"></div>
                    </button>
                    <button class="skill-btn" id="skillBtn2" title="护盾技能">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3z"/>
                        </svg>
                        <div class="cooldown-overlay"></div>
                    </button>
                    <button class="fire-btn" id="fireBtn" title="发射">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- 游戏结束界面 -->
        <div id="gameOverScreen">
            <h2 class="game-over-title" id="gameOverTitle">游戏结束</h2>
            <div class="final-score">最终得分: <span id="finalScore">0</span></div>
            <div class="game-over-buttons">
                <button class="restart-btn" id="restartBtn">重新开始</button>
                <button class="menu-btn" id="menuBtn">返回菜单</button>
            </div>
        </div>

        <!-- 暂停菜单 -->
        <div id="pauseMenu">
            <h2 class="pause-title">游戏暂停</h2>
            <div class="pause-buttons">
                <button class="pause-btn resume-btn" id="resumeBtn">继续游戏</button>
                <button class="pause-btn restart-pause-btn" id="restartPauseBtn">重新开始</button>
                <button class="pause-btn quit-btn" id="quitBtn">退出游戏</button>
            </div>
        </div>

        <!-- Canvas 游戏画布 -->
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        /**
         * 光能守护者 - 移动端UI模块
         * Eye Tower Defense - Mobile UI Module
         * 
         * 功能模块：
         * 1. MobileUIManager - UI管理器
         * 2. InputController - 输入控制器（触摸+眼动）
         * 3. VisualEffects - 视觉特效
         * 4. GameStateManager - 游戏状态管理
         */

        // ===== 配置常量 =====
        const CONFIG = {
            // 性能配置
            FPS: 60,
            CANVAS_SCALE: window.devicePixelRatio || 1,
            
            // 触摸配置
            TOUCH_DEBOUNCE: 50, // 触摸防抖(ms)
            DOUBLE_TAP_DELAY: 300, // 双击延迟
            
            // UI配置
            HUD_ANIMATION_SPEED: 0.3,
            COOLDOWN_PRECISION: 100, // 冷却精度(ms)
            
            // 技能配置
            SKILLS: {
                laser: { cooldown: 5000, duration: 3000 },
                shield: { cooldown: 8000, duration: 5000 }
            }
        };

        // ===== MobileUIManager - UI管理器 =====
        class MobileUIManager {
            constructor() {
                this.elements = {};
                this.state = {
                    isPlaying: false,
                    isPaused: false,
                    isGameOver: false,
                    score: 0,
                    health: 100,
                    wave: 1,
                    totalWaves: 10,
                    eyeTrackingConnected: false
                };
                this.animations = new Map();
                this.init();
            }

            init() {
                this.cacheElements();
                this.bindEvents();
                this.setupOrientationLock();
                this.setupFullscreen();
                this.checkOrientation();
            }

            // 缓存DOM元素
            cacheElements() {
                this.elements = {
                    // 容器
                    container: document.getElementById('gameContainer'),
                    canvas: document.getElementById('gameCanvas'),
                    
                    // 屏幕
                    loadingScreen: document.getElementById('loadingScreen'),
                    startScreen: document.getElementById('startScreen'),
                    hud: document.getElementById('hud'),
                    gameOverScreen: document.getElementById('gameOverScreen'),
                    pauseMenu: document.getElementById('pauseMenu'),
                    orientationLock: document.getElementById('orientationLock'),
                    
                    // HUD元素
                    healthValue: document.getElementById('healthValue'),
                    scoreValue: document.getElementById('scoreValue'),
                    waveValue: document.getElementById('waveValue'),
                    totalWaves: document.getElementById('totalWaves'),
                    eyeStatus: document.getElementById('eyeStatus'),
                    
                    // 按钮
                    startBtn: document.getElementById('startBtn'),
                    pauseBtn: document.getElementById('pauseBtn'),
                    fireBtn: document.getElementById('fireBtn'),
                    skillBtn1: document.getElementById('skillBtn1'),
                    skillBtn2: document.getElementById('skillBtn2'),
                    restartBtn: document.getElementById('restartBtn'),
                    menuBtn: document.getElementById('menuBtn'),
                    resumeBtn: document.getElementById('resumeBtn'),
                    restartPauseBtn: document.getElementById('restartPauseBtn'),
                    quitBtn: document.getElementById('quitBtn'),
                    
                    // 游戏结束
                    gameOverTitle: document.getElementById('gameOverTitle'),
                    finalScore: document.getElementById('finalScore'),
                    
                    // 加载
                    loadingBarFill: document.getElementById('loadingBarFill')
                };
            }

            // 绑定事件
            bindEvents() {
                // 开始游戏
                this.elements.startBtn.addEventListener('click', () => this.startGame());
                
                // 暂停/继续
                this.elements.pauseBtn.addEventListener('click', () => this.togglePause());
                this.elements.resumeBtn.addEventListener('click', () => this.togglePause());
                
                // 发射按钮
                this.bindFireButton();
                
                // 技能按钮
                this.bindSkillButtons();
                
                // 重新开始
                this.elements.restartBtn.addEventListener('click', () => this.restartGame());
                this.elements.restartPauseBtn.addEventListener('click', () => this.restartGame());
                
                // 返回菜单
                this.elements.menuBtn.addEventListener('click', () => this.returnToMenu());
                this.elements.quitBtn.addEventListener('click', () => this.returnToMenu());
                
                // 方向变化
                window.addEventListener('resize', () => this.checkOrientation());
                window.addEventListener('orientationchange', () => this.checkOrientation());
                
                // 可见性变化（切后台）
                document.addEventListener('visibilitychange', () => this.handleVisibilityChange());
            }

            // 绑定发射按钮（带防误触）
            bindFireButton() {
                const btn = this.elements.fireBtn;
                let lastTap = 0;
                
                const handleFire = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    
                    const now = Date.now();
                    if (now - lastTap < CONFIG.TOUCH_DEBOUNCE) return;
                    lastTap = now;
                    
                    // 触发发射事件
                    this.fireLaser();
                    
                    // 触觉反馈
                    this.triggerHaptic('light');
                    
                    // 视觉反馈
                    this.showTouchFeedback(e);
                };
                
                btn.addEventListener('touchstart', handleFire, { passive: false });
                btn.addEventListener('mousedown', handleFire);
            }

            // 绑定技能按钮
            bindSkillButtons() {
                this.elements.skillBtn1.addEventListener('click', () => this.activateSkill('laser'));
                this.elements.skillBtn2.addEventListener('click', () => this.activateSkill('shield'));
            }

            // 设置横屏锁定
            setupOrientationLock() {
                // 尝试锁定屏幕方向
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock('landscape').catch(() => {
                        // 锁定失败，使用提示方式
                    });
                }
            }

            // 设置全屏模式
            setupFullscreen() {
                const container = this.elements.container;
                
                // 监听全屏变化
                document.addEventListener('fullscreenchange', () => {
                    if (!document.fullscreenElement) {
                        // 退出全屏时可选暂停游戏
                    }
                });

                // 尝试进入全屏
                const enterFullscreen = () => {
                    if (container.requestFullscreen) {
                        container.requestFullscreen().catch(() => {});
                    } else if (container.webkitRequestFullscreen) {
                        container.webkitRequestFullscreen();
                    }
                };

                // 首次点击开始按钮时进入全屏
                this.elements.startBtn.addEventListener('click', enterFullscreen, { once: true });
            }

            // 检查屏幕方向
            checkOrientation() {
                const isPortrait = window.innerHeight > window.innerWidth;
                const orientationLock = this.elements.orientationLock;
                
                if (isPortrait && window.innerWidth < 768) {
                    orientationLock.classList.add('show');
                } else {
                    orientationLock.classList.remove('show');
                }
            }

            // 处理可见性变化
            handleVisibilityChange() {
                if (document.hidden && this.state.isPlaying && !this.state.isPaused) {
                    this.togglePause();
                }
            }

            // ===== 游戏状态控制 =====
            
            // 加载资源
            async loadResources() {
                const loadingBar = this.elements.loadingBarFill;
                const steps = 5;
                
                for (let i = 1; i <= steps; i++) {
                    await new Promise(r => setTimeout(r, 200));
                    loadingBar.style.width = `${(i / steps) * 100}%`;
                }
                
                // 隐藏加载界面
                this.elements.loadingScreen.classList.add('hidden');
            }

            // 开始游戏
            startGame() {
                this.state.isPlaying = true;
                this.state.isPaused = false;
                this.state.score = 0;
                this.state.health = 100;
                this.state.wave = 1;
                
                // 隐藏开始界面，显示HUD
                this.elements.startScreen.classList.add('hidden');
                this.elements.hud.classList.add('show');
                
                // 初始化游戏画布
                this.initCanvas();
                
                // 开始游戏循环
                this.startGameLoop();
                
                // 发送游戏开始事件
                this.emit('gameStart', { timestamp: Date.now() });
            }

            // 暂停/继续
            togglePause() {
                if (!this.state.isPlaying || this.state.isGameOver) return;
                
                this.state.isPaused = !this.state.isPaused;
                
                if (this.state.isPaused) {
                    this.elements.pauseMenu.classList.add('show');
                    this.emit('gamePause', { timestamp: Date.now() });
                } else {
                    this.elements.pauseMenu.classList.remove('show');
                    this.emit('gameResume', { timestamp: Date.now() });
                }
            }

            // 重新开始
            restartGame() {
                // 重置状态
                this.state.isGameOver = false;
                this.state.isPaused = false;
                this.state.score = 0;
                this.state.health = 100;
                this.state.wave = 1;
                
                // 更新UI
                this.updateHUD();
                this.elements.gameOverScreen.classList.remove('show');
                this.elements.pauseMenu.classList.remove('show');
                
                // 重新开始游戏循环
                this.emit('gameRestart', { timestamp: Date.now() });
            }

            // 返回菜单
            returnToMenu() {
                this.state.isPlaying = false;
                this.state.isPaused = false;
                this.state.isGameOver = false;
                
                // 隐藏所有游戏界面
                this.elements.hud.classList.remove('show');
                this.elements.gameOverScreen.classList.remove('show');
                this.elements.pauseMenu.classList.remove('show');
                
                // 显示开始界面
                this.elements.startScreen.classList.remove('hidden');
                
                // 发送退出事件
                this.emit('gameQuit', { timestamp: Date.now() });
            }

            // 游戏结束
            gameOver(victory) {
                this.state.isGameOver = true;
                this.state.isPlaying = false;
                
                // 更新游戏结束界面
                const title = this.elements.gameOverTitle;
                title.textContent = victory ? '胜利！' : '游戏结束';
                title.className = `game-over-title ${victory ? 'victory' : 'defeat'}`;
                this.elements.finalScore.textContent = this.state.score;
                
                // 显示游戏结束界面
                this.elements.gameOverScreen.classList.add('show');
                
                // 发送游戏结束事件
                this.emit('gameOver', { victory, score: this.state.score });
            }

            // ===== HUD更新 =====
            
            updateHUD() {
                this.elements.healthValue.textContent = this.state.health;
                this.elements.scoreValue.textContent = this.state.score;
                this.elements.waveValue.textContent = this.state.wave;
            }

            setHealth(value) {
                this.state.health = Math.max(0, Math.min(100, value));
                this.elements.healthValue.textContent = this.state.health;
                
                // 生命值警告动画
                if (this.state.health <= 20) {
                    this.elements.healthValue.style.color = '#ff4757';
                    this.elements.healthValue.style.animation = 'pulse 1s infinite';
                } else {
                    this.elements.healthValue.style.color = '';
                    this.elements.healthValue.style.animation = '';
                }
            }

            setScore(value) {
                this.state.score = value;
                this.elements.scoreValue.textContent = this.state.score;
            }

            addScore(points) {
                this.state.score += points;
                this.elements.scoreValue.textContent = this.state.score;
                
                // 分数增加动画
                const stat = this.elements.scoreValue.parentElement;
                stat.style.transform = 'scale(1.2)';
                setTimeout(() => stat.style.transform = '', 200);
            }

            setWave(value) {
                this.state.wave = value;
                this.elements.waveValue.textContent = this.state.wave;
            }

            // ===== 输入控制 =====
            
            fireLaser() {
                // 触发激光发射事件
                this.emit('fireLaser', { 
                    timestamp: Date.now(),
                    // 眼动目标位置将由眼动追踪模块提供
                    targetX: window.lastEyeX || 0,
                    targetY: window.lastEyeY || 0
                });
            }

            activateSkill(skillType) {
                const skillConfig = CONFIG.SKILLS[skillType];
                if (!skillConfig) return;
                
                const btn = skillType === 'laser' ? this.elements.skillBtn1 : this.elements.skillBtn2;
                
                // 检查冷却
                if (btn.classList.contains('cooldown')) return;
                
                // 触发技能事件
                this.emit('skillActivated', { 
                    type: skillType, 
                    timestamp: Date.now() 
                });
                
                // 触觉反馈
                this.triggerHaptic('medium');
                
                // 开始冷却
                this.startCooldown(btn, skillConfig.cooldown);
            }

            startCooldown(button, duration) {
                button.classList.add('cooldown');
                const overlay = button.querySelector('.cooldown-overlay');
                
                let remaining = duration;
                const interval = 100; // 100ms更新一次
                
                const timer = setInterval(() => {
                    remaining -= interval;
                    const percent = ((duration - remaining) / duration) * 100;
                    overlay.style.height = `${percent}%`;
                    
                    if (remaining <= 0) {
                        clearInterval(timer);
                        button.classList.remove('cooldown');
                        overlay.style.height = '0%';
                    }
                }, interval);
            }

            // ===== 眼动追踪集成 =====
            
            setEyeTrackingConnected(connected) {
                this.state.eyeTrackingConnected = connected;
                const statusEl = this.elements.eyeStatus;
                
                if (connected) {
                    statusEl.classList.add('connected');
                } else {
                    statusEl.classList.remove('connected');
                }
                
                this.emit('eyeTrackingStatus', { connected });
            }

            // 接收眼动位置更新
            updateEyePosition(x, y) {
                // 存储最后的眼动位置
                window.lastEyeX = x;
                window.lastEyeY = y;
                
                // 触发眼动更新事件
                this.emit('eyePosition', { x, y, timestamp: Date.now() });
            }

            // ===== Canvas渲染 =====
            
            initCanvas() {
                const canvas = this.elements.canvas;
                const ctx = canvas.getContext('2d');
                
                // 设置Canvas尺寸
                this.resizeCanvas();
                
                // 监听尺寸变化
                window.addEventListener('resize', () => this.resizeCanvas());
                
                // 存储上下文供游戏循环使用
                this.canvasContext = ctx;
            }

            resizeCanvas() {
                const canvas = this.elements.canvas;
                const container = this.elements.container;
                
                // 获取实际显示尺寸
                const rect = container.getBoundingClientRect();
                
                // 设置Canvas实际尺寸（考虑设备像素比）
                canvas.width = rect.width * CONFIG.CANVAS_SCALE;
                canvas.height = rect.height * CONFIG.CANVAS_SCALE;
                
                // 设置CSS尺寸
                canvas.style.width = `${rect.width}px`;
                canvas.style.height = `${rect.height}px`;
                
                // 缩放上下文
                const ctx = canvas.getContext('2d');
                ctx.scale(CONFIG.CANVAS_SCALE, CONFIG.CANVAS_SCALE);
            }

            startGameLoop() {
                if (this.gameLoopId) return;
                
                let lastTime = 0;
                
                const gameLoop = (currentTime) => {
                    if (!this.state.isPlaying || this.state.isPaused) {
                        this.gameLoopId = requestAnimationFrame(gameLoop);
                        return;
                    }
                    
                    // 计算delta time
                    const deltaTime = currentTime - lastTime;
                    lastTime = currentTime;
                    
                    // 更新游戏状态
                    this.update(deltaTime);
                    
                    // 渲染游戏画面
                    this.render();
                    
                    this.gameLoopId = requestAnimationFrame(gameLoop);
                };
                
                this.gameLoopId = requestAnimationFrame(gameLoop);
            }

            update(deltaTime) {
                // 触发更新事件，由游戏核心模块处理
                this.emit('gameUpdate', { deltaTime, timestamp: Date.now() });
            }

            render() {
                const ctx = this.canvasContext;
                const canvas = this.elements.canvas;
                
                // 清空画布
                ctx.clearRect(0, 0, canvas.width / CONFIG.CANVAS_SCALE, canvas.height / CONFIG.CANVAS_SCALE);
                
                // 触发渲染事件，由游戏核心模块绘制
                this.emit('gameRender', { ctx, timestamp: Date.now() });
            }

            // ===== 辅助功能 =====
            
            // 事件发射器
            emit(eventName, data) {
                // 创建自定义事件
                const event = new CustomEvent(`mobileUI:${eventName}`, {
                    detail: data,
                    bubbles: true
                });
                document.dispatchEvent(event);
                
                // 同时触发全局回调（如果存在）
                if (window.onMobileUIEvent) {
                    window.onMobileUIEvent(eventName, data);
                }
            }

            // 触觉反馈
            triggerHaptic(type) {
                if (navigator.vibrate) {
                    switch (type) {
                        case 'light':
                            navigator.vibrate(10);
                            break;
                        case 'medium':
                            navigator.vibrate(20);
                            break;
                        case 'heavy':
                            navigator.vibrate([30, 50, 30]);
                            break;
                    }
                }
            }

            // 触摸反馈动画
            showTouchFeedback(e) {
                const touch = e.touches ? e.touches[0] : e;
                const x = touch.clientX || touch.pageX;
                const y = touch.clientY || touch.pageY;
                
                const feedback = document.createElement('div');
                feedback.className = 'touch-feedback';
                feedback.style.left = `${x - 25}px`;
                feedback.style.top = `${y - 25}px`;
                
                document.body.appendChild(feedback);
                
                setTimeout(() => feedback.remove(), 400);
            }

            // ===== 公共API =====
            
            // 获取当前状态
            getState() {
                return { ...this.state };
            }

            // 更新游戏数据（由游戏核心调用）
            updateGameData(data) {
                if (data.health !== undefined) this.setHealth(data.health);
                if (data.score !== undefined) this.setScore(data.score);
                if (data.wave !== undefined) this.setWave(data.wave);
            }

            // 显示伤害效果
            showDamage() {
                const canvas = this.elements.canvas;
                canvas.style.animation = 'none';
                canvas.offsetHeight; // 触发重排
                canvas.style.animation = 'shake 0.5s ease';
                
                // 红色闪烁
                const overlay = document.createElement('div');
                overlay.style.cssText = `
                    position: fixed;
                    top: 0; left: 0; right: 0; bottom: 0;
                    background: rgba(255, 0, 0, 0.3);
                    pointer-events: none;
                    z-index: 9998;
                    animation: fadeOut 0.5s ease forwards;
                `;
                document.body.appendChild(overlay);
                setTimeout(() => overlay.remove(), 500);
            }
        }

        // ===== 初始化 =====
        
        // 创建全局UI管理器实例
        window.mobileUI = new MobileUIManager();

        // 加载资源并初始化
        window.addEventListener('DOMContentLoaded', () => {
            window.mobileUI.loadResources();
        });

        // 添加CSS动画
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
                20%, 40%, 60%, 80% { transform: translateX(5px); }
            }
            @keyframes fadeOut {
                to { opacity: 0; }
            }
            @keyframes pulse {
                0%, 100% { opacity: 1; }
                50% { opacity: 0.5; }
            }
        `;
        document.head.appendChild(style);

        // ===== 与其他模块的集成接口 =====
        
        /**
         * 游戏核心模块可以通过以下方式与UI模块交互：
         * 
         * 1. 监听UI事件：
         *    document.addEventListener('mobileUI:fireLaser', (e) => {
         *        console.log('发射激光:', e.detail);
         *    });
         * 
         * 2. 更新游戏数据：
         *    window.mobileUI.updateGameData({
         *        health: 80,
         *        score: 1500,
         *        wave: 3
         *    });
         * 
         * 3. 更新眼动位置：
         *    window.mobileUI.updateEyePosition(x, y);
         * 
         * 4. 设置眼动连接状态：
         *    window.mobileUI.setEyeTrackingConnected(true);
         * 
         * 5. 触发游戏结束：
         *    window.mobileUI.gameOver(true); // 胜利
         *    window.mobileUI.gameOver(false); // 失败
         */

        // 导出模块（如果支持ES6模块）
        if (typeof module !== 'undefined' && module.exports) {
            module.exports = MobileUIManager;
        }
    </script>
</body>
</html>
