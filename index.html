<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>眼动塔防 v3 - Eye Tower Defense</title>
    <script src="https://cdn.jsdelivr.net/npm/webgazer@3.0.0/webgazer.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #0f0f23; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        #gameCanvas { display: block; width: 100%; height: 100%; }
        .menu-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: linear-gradient(135deg, rgba(26,26,46,0.98) 0%, rgba(15,15,35,0.99) 100%); z-index: 200; }
        .menu-screen.hidden { display: none !important; }
        .game-title { font-size: clamp(28px, 8vw, 48px); font-weight: bold; color: #e94560; margin-bottom: 10px; text-shadow: 0 0 30px rgba(233, 69, 96, 0.8); }
        .btn { padding: 12px 40px; font-size: 16px; font-weight: bold; color: white; background: linear-gradient(135deg, #e94560, #ff6b6b); border: none; border-radius: 50px; cursor: pointer; margin: 8px; }
        .hud { position: absolute; top: 0; left: 0; width: 100%; padding: 10px 15px; display: flex; justify-content: space-between; background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent); pointer-events: none; }
        .hud-item { display: flex; align-items: center; gap: 6px; color: white; font-size: clamp(12px, 3vw, 16px); font-weight: bold; }
        .health-bar { width: 80px; height: 10px; background: rgba(0,0,0,0.5); border-radius: 5px; overflow: hidden; }
        .health-fill { height: 100%; background: linear-gradient(90deg, #e94560, #ff6b6b); transition: width 0.3s; }
        .energy-bar { width: 80px; height: 10px; background: rgba(0,0,0,0.5); border-radius: 5px; overflow: hidden; margin-left: 4px; }
        .energy-fill { height: 100%; background: linear-gradient(90deg, #fbbf24, #f59e0b); transition: width 0.1s; }
        .game-over { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; justify-content: center; align-items: center; background: rgba(0, 0, 0, 0.92); z-index: 300; }
        .game-over.show { display: flex; }
        .toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 12px 25px; background: rgba(0, 0, 0, 0.9); color: white; border-radius: 8px; font-size: 14px; z-index: 10000; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        .toast.show { opacity: 1; }
        .permission-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 5000; transition: opacity 0.3s; }
        .permission-overlay.hidden { opacity: 0; pointer-events: none; }
        .permission-icon { font-size: 64px; margin-bottom: 20px; }
        .permission-title { font-size: 24px; color: #fff; font-weight: bold; margin-bottom: 10px; text-align: center; }
        .permission-text { font-size: 14px; color: rgba(255,255,255,0.7); margin-bottom: 25px; text-align: center; max-width: 300px; line-height: 1.5; }
        .permission-status { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 15px; text-align: center; }
        .eye-status { position: fixed; top: 10px; right: 10px; width: 12px; height: 12px; border-radius: 50%; background: #6b7280; z-index: 4000; border: 2px solid rgba(255,255,255,0.3); }
        .eye-status.active { background: #22c55e; box-shadow: 0 0 10px #22c55e; }
        .eye-status.inactive { background: #ef4444; }
        .control-toggle { position: fixed; top: 10px; right: 30px; padding: 4px 10px; background: rgba(0,0,0,0.6); color: #fff; font-size: 11px; border-radius: 12px; z-index: 4000; border: 1px solid rgba(255,255,255,0.2); pointer-events: auto; cursor: pointer; }
        
        /* 校准覆盖层 */
        .calibration-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 6000; transition: opacity 0.3s; }
        .calibration-overlay.hidden { opacity: 0; pointer-events: none; }
        .calibration-title { font-size: 28px; color: #e94560; font-weight: bold; margin-bottom: 15px; text-shadow: 0 0 20px rgba(233, 69, 96, 0.6); }
        .calibration-instruction { font-size: 16px; color: rgba(255,255,255,0.8); margin-bottom: 40px; text-align: center; max-width: 300px; line-height: 1.5; }
        .calibration-progress { position: absolute; bottom: 60px; display: flex; gap: 10px; }
        .progress-dot { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,0.2); transition: background 0.3s; }
        .progress-dot.active { background: #00ffff; box-shadow: 0 0 10px rgba(0, 255, 255, 0.6); }
        .progress-dot.completed { background: #00ff00; }
        .calibration-point { width: 40px; height: 40px; border-radius: 50%; background: radial-gradient(circle, #00ffff 0%, #0088ff 100%); box-shadow: 0 0 30px rgba(0, 255, 255, 0.6); position: absolute; cursor: pointer; animation: pulse 1.2s ease-in-out infinite; transform: translate(-50%, -50%); }
        .calibration-point.completed { background: radial-gradient(circle, #00ff00 0%, #00aa00 100%); animation: none; }
        @keyframes pulse { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(0.85); } }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="mainMenu" class="menu-screen">
        <div class="game-title">👁️ 眼动塔防 v3</div>
        <div style="color: rgba(255,255,255,0.6); margin-bottom: 30px; text-align: center;">竖屏游玩 · 变身激光 · 狗头Boss · 加血道具</div>
        <button class="btn" id="startBtn">开始游戏</button>
    </div>
    <div id="hud" class="hud" style="display: none;">
        <div class="hud-item">
            <span>❤️</span>
            <div class="health-bar"><div class="health-fill" id="healthFill" style="width: 100%;"></div></div>
        </div>
        <div class="hud-item">
            <span>⚡</span>
            <div class="energy-bar"><div class="energy-fill" id="energyFill" style="width: 0%;"></div></div>
        </div>
        <div class="hud-item"><span>🏆</span><span id="scoreDisplay">0</span></div>
        <div class="hud-item"><span>🌊</span><span id="waveDisplay">1</span></div>
    </div>
    <div id="gameOver" class="game-over">
        <div class="game-title">游戏结束</div>
        <div style="font-size: 24px; color: #ffd700; margin: 15px 0;">最终得分: <span id="finalScore">0</span></div>
        <button class="btn" id="restartBtn">重新开始</button>
        <button class="btn" id="menuBtn" style="background: linear-gradient(135deg, #4a90d9, #357abd); margin-top: 10px;">返回菜单</button>
    </div>
    <div id="permissionOverlay" class="permission-overlay hidden">
        <div class="permission-icon">📷</div>
        <div class="permission-title">启用眼动追踪</div>
        <div class="permission-text">
            我们需要访问摄像头来实现眼动瞄准。<br>视频仅在本地处理，不会上传。<br>您也可以拒绝，改用触摸或鼠标控制。
        </div>
        <button class="btn" id="allowCameraBtn">允许访问</button>
        <button class="btn" id="denyCameraBtn" style="background: linear-gradient(135deg, #6b7280, #4b5563);">使用触摸/鼠标</button>
        <div class="permission-status" id="permissionStatus">正在初始化眼动追踪...</div>
    </div>
    <div id="calibrationOverlay" class="calibration-overlay hidden">
        <div class="calibration-title">眼动校准</div>
        <div class="calibration-instruction" id="calibrationInstruction">请用眼睛注视屏幕上的圆点，并用手指点击它</div>
        <div class="calibration-progress" id="calibrationProgress"></div>
    </div>
    <div id="eyeStatus" class="eye-status"></div>
    <div id="controlToggle" class="control-toggle" style="display:none;">控制: 自动</div>
    <div id="toast" class="toast"></div>

    <script>
        class Vector2 {
            constructor(x=0, y=0) { this.x=x; this.y=y; }
            add(v) { return new Vector2(this.x+v.x, this.y+v.y); }
            sub(v) { return new Vector2(this.x-v.x, this.y-v.y); }
            mult(s) { return new Vector2(this.x*s, this.y*s); }
            mag() { return Math.sqrt(this.x*this.x+this.y*this.y); }
            normalize() { const m=this.mag(); return m>0?this.div(m):new Vector2(0,0); }
            div(s) { return new Vector2(this.x/s, this.y/s); }
            dist(v) { return this.sub(v).mag(); }
            static fromAngle(a) { return new Vector2(Math.cos(a), Math.sin(a)); }
        }

        const CONFIG = {
            PLAYER_MAX_HEALTH: 100,
            LASER_DAMAGE: 15,
            ENEMY_SPAWN_RATE: 1500,
            ENEMY_SPEED_BASE: 0.8,
            GROUND_HEIGHT_RATIO: 2/3,
            ENERGY_PER_HIT: 5,
            MAX_ENERGY: 100,
            TRANSFORM_DRAIN: 35,
            TRANSFORM_DAMAGE: 40,
            BOSS_SPAWN_WAVE: 5,
            BOSS_HEALTH: 400,
            BOSS_KNOCKBACK_THRESHOLD: 100
        };

        const GameState = { MENU: 'menu', PLAYING: 'playing', GAME_OVER: 'game_over' };

        const game = {
            canvas: null, ctx: null, state: GameState.MENU,
            score: 0, wave: 1, entities: [], particles: [],
            lastTime: 0, enemySpawnTimer: 0, waveTimer: 0,
            player: null, groundY: 0, bossSpawnedThisWave: false
        };

        const camera = {
            x: 0, y: 0,
            zoom: 0.72,
            update(target) {
                if (target) {
                    this.x = target.position.x;
                    const desiredScreenGroundY = game.canvas.height * (2/3);
                    this.y = game.groundY - (desiredScreenGroundY - game.canvas.height / 2) / this.zoom;
                }
            },
            apply(ctx) {
                const cx = game.canvas.width / 2;
                const cy = game.canvas.height / 2;
                ctx.save();
                ctx.translate(cx, cy);
                ctx.scale(this.zoom, this.zoom);
                ctx.translate(-this.x, -this.y);
            },
            restore(ctx) { ctx.restore(); },
            screenToWorld(sx, sy) {
                const cx = game.canvas.width / 2;
                const cy = game.canvas.height / 2;
                return {
                    x: this.x + (sx - cx) / this.zoom,
                    y: this.y + (sy - cy) / this.zoom
                };
            },
            getWorldBounds() {
                const cx = game.canvas.width / 2;
                const cy = game.canvas.height / 2;
                const halfW = cx / this.zoom;
                const halfH = cy / this.zoom;
                return { left: this.x - halfW, right: this.x + halfW, top: this.y - halfH, bottom: this.y + halfH };
            }
        };

        const eyeTracking = {
            initialized: false, active: false, ready: false,
            gazeX: 0, gazeY: 0, smoothX: 0, smoothY: 0,
            isCalibrating: false, calibrationIndex: 0,
            calibrationPositions: [
                {x: 10, y: 10}, {x: 50, y: 10}, {x: 90, y: 10},
                {x: 10, y: 50}, {x: 50, y: 50}, {x: 90, y: 50},
                {x: 10, y: 90}, {x: 50, y: 90}, {x: 90, y: 90}
            ],
            checkAvailable() { return typeof webgazer !== 'undefined'; },
            init() {
                if (!this.checkAvailable()) { updateEyeStatus(false); return false; }
                try {
                    webgazer.setGazeListener((data) => {
                        if (data && data.x != null && data.y != null) {
                            this.gazeX = data.x; this.gazeY = data.y; this.active = true; updateEyeStatus(true);
                        }
                    });
                    webgazer.showVideo(true); webgazer.showFaceOverlay(true); webgazer.showFaceFeedbackBox(true);
                    this.styleVideoPreview(); this.initialized = true; return true;
                } catch (e) { console.error(e); updateEyeStatus(false); return false; }
            },
            async start() {
                if (!this.initialized) return false;
                try {
                    showToast('正在请求摄像头权限...');
                    await webgazer.begin();
                    this.active = true;
                    this.styleVideoPreview();
                    showToast('权限已获取，即将开始校准');
                    setTimeout(() => { this.startCalibration(); }, 600);
                    return true;
                } catch (e) {
                    console.error(e);
                    this.ready = false; this.active = false; updateEyeStatus(false); updateControlToggle();
                    if (e.name === 'NotAllowedError' || e.name === 'PermissionDeniedError') {
                        showToast('摄像头权限被拒绝');
                    } else if (e.name === 'NotFoundError') {
                        showToast('未找到摄像头设备');
                    } else {
                        showToast('眼动启动失败，已切换触摸/鼠标');
                    }
                    return false;
                }
            },
            startCalibration() {
                if (this.isCalibrating) return;
                this.isCalibrating = true; this.calibrationIndex = 0;
                const overlay = document.getElementById('calibrationOverlay');
                overlay.classList.remove('hidden');
                this.createProgressDots();
                this.showNextCalibrationPoint();
            },
            createProgressDots() {
                const container = document.getElementById('calibrationProgress');
                container.innerHTML = '';
                for (let i = 0; i < this.calibrationPositions.length; i++) {
                    const dot = document.createElement('div');
                    dot.className = 'progress-dot'; dot.id = 'progress-dot-' + i;
                    container.appendChild(dot);
                }
            },
            showNextCalibrationPoint() {
                if (this.calibrationIndex >= this.calibrationPositions.length) {
                    this.finishCalibration(); return;
                }
                for (let i = 0; i < this.calibrationPositions.length; i++) {
                    const dot = document.getElementById('progress-dot-' + i);
                    dot.classList.remove('active', 'completed');
                    if (i < this.calibrationIndex) dot.classList.add('completed');
                    else if (i === this.calibrationIndex) dot.classList.add('active');
                }
                const pos = this.calibrationPositions[this.calibrationIndex];
                this.createCalibrationPoint(pos.x, pos.y);
                const remaining = this.calibrationPositions.length - this.calibrationIndex;
                document.getElementById('calibrationInstruction').textContent = `请注视并点击圆点（剩余 ${remaining} 个）`;
            },
            createCalibrationPoint(x, y) {
                const old = document.getElementById('currentCalibrationPoint');
                if (old) old.remove();
                const screenX = (x / 100) * window.innerWidth;
                const screenY = (y / 100) * window.innerHeight;
                const point = document.createElement('div');
                point.id = 'currentCalibrationPoint';
                point.className = 'calibration-point';
                point.style.left = screenX + 'px';
                point.style.top = screenY + 'px';
                const handler = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    point.classList.add('completed');
                    setTimeout(() => {
                        point.remove();
                        this.calibrationIndex++;
                        this.showNextCalibrationPoint();
                    }, 200);
                };
                point.addEventListener('click', handler);
                point.addEventListener('touchstart', handler, {passive: false});
                document.getElementById('calibrationOverlay').appendChild(point);
            },
            finishCalibration() {
                this.isCalibrating = false;
                document.getElementById('calibrationOverlay').classList.add('hidden');
                this.ready = true;
                updateEyeStatus(true); updateControlToggle();
                showToast('眼动追踪已就绪！');
                console.log('Calibration finished');
            },
            stop() {
                if (typeof webgazer !== 'undefined') webgazer.end();
                this.ready = false; this.active = false; this.isCalibrating = false;
                document.getElementById('calibrationOverlay').classList.add('hidden');
                const old = document.getElementById('currentCalibrationPoint');
                if (old) old.remove();
                updateEyeStatus(false); updateControlToggle();
            },
            styleVideoPreview() {
                setTimeout(() => {
                    const el = document.getElementById('webgazerVideoContainer');
                    if (el) el.style.cssText = `position:fixed!important;top:10px!important;right:10px!important;width:100px!important;height:75px!important;border-radius:8px!important;overflow:hidden!important;border:2px solid rgba(0,255,255,0.5)!important;z-index:9999!important;`;
                }, 1000);
            },
            update() {
                if (this.active) {
                    this.smoothX += (this.gazeX - this.smoothX) * 0.2;
                    this.smoothY += (this.gazeY - this.smoothY) * 0.2;
                }
            }
        };

        const input = { mode: 'mouse', mouseX: 0, mouseY: 0, touchX: 0, touchY: 0, hasTouch: false, hasMouse: false };

        function updateInput() {
            eyeTracking.update();
            const rect = game.canvas.getBoundingClientRect();
            if (eyeTracking.ready) {
                input.mode = 'eye';
                const pos = camera.screenToWorld(eyeTracking.smoothX - rect.left, eyeTracking.smoothY - rect.top);
                if (game.state === GameState.PLAYING && game.player) game.player.aimAt(pos.x, pos.y);
            } else if (input.hasTouch) {
                input.mode = 'touch';
                const pos = camera.screenToWorld(input.touchX, input.touchY);
                if (game.state === GameState.PLAYING && game.player) game.player.aimAt(pos.x, pos.y);
            } else if (input.hasMouse) {
                input.mode = 'mouse';
                const pos = camera.screenToWorld(input.mouseX, input.mouseY);
                if (game.state === GameState.PLAYING && game.player) game.player.aimAt(pos.x, pos.y);
            }
            updateControlToggle();
        }

        function updateEyeStatus(active) {
            document.getElementById('eyeStatus').className = active ? 'eye-status active' : 'eye-status inactive';
        }
        function updateControlToggle() {
            const el = document.getElementById('controlToggle');
            if (game.state !== GameState.PLAYING) { el.style.display = 'none'; return; }
            el.style.display = 'block';
            const mode = eyeTracking.ready ? '眼动' : (input.mode === 'touch' ? '触摸' : '鼠标');
            el.textContent = '控制: ' + mode;
        }

        class Entity {
            constructor(x, y, radius=10) {
                this.position = new Vector2(x, y);
                this.velocity = new Vector2(0, 0);
                this.radius = radius;
                this.markedForDeletion = false;
                this.alpha = 1;
            }
            update(deltaTime) { this.position = this.position.add(this.velocity.mult(deltaTime/16)); }
            draw(ctx) {}
        }

        class Particle extends Entity {
            constructor(x, y, color, lifetime) {
                super(x, y, 2); this.color = color; this.lifetime = lifetime; this.maxLifetime = lifetime;
                this.velocity = new Vector2((Math.random()-0.5)*3, (Math.random()-0.5)*3);
            }
            update(deltaTime) {
                super.update(deltaTime); this.lifetime -= deltaTime;
                this.alpha = this.lifetime / this.maxLifetime;
                if (this.lifetime <= 0) this.markedForDeletion = true;
            }
            draw(ctx) {
                ctx.save(); ctx.globalAlpha = this.alpha; ctx.fillStyle = this.color;
                ctx.beginPath(); ctx.arc(this.position.x, this.position.y, this.radius, 0, Math.PI*2); ctx.fill(); ctx.restore();
            }
        }

        class HealthDrop extends Entity {
            constructor(x, y) {
                super(x, y, 12);
                this.bobOffset = Math.random() * Math.PI * 2;
            }
            update(deltaTime) {
                this.bobOffset += deltaTime * 0.005;
            }
            draw(ctx) {
                const bob = Math.sin(this.bobOffset) * 4;
                ctx.save();
                ctx.translate(this.position.x, this.position.y + bob);
                ctx.shadowColor = '#f472b6'; ctx.shadowBlur = 12;
                ctx.fillStyle = '#f472b6';
                ctx.beginPath();
                ctx.moveTo(0, 4);
                ctx.bezierCurveTo(-10, -6, -16, 4, 0, 14);
                ctx.bezierCurveTo(16, 4, 10, -6, 0, 4);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.restore();
            }
        }

        class LaserBolt extends Entity {
            constructor(startX, startY, endX, endY) {
                super(startX, startY, 0); this.start = new Vector2(startX, startY); this.end = new Vector2(endX, endY);
                this.lifetime = 150; this.maxLifetime = 150;
            }
            update(deltaTime) {
                this.lifetime -= deltaTime; this.alpha = this.lifetime / this.maxLifetime;
                if (this.lifetime <= 0) this.markedForDeletion = true;
            }
            draw(ctx) {
                ctx.save();
                const grad = ctx.createLinearGradient(this.start.x, this.start.y, this.end.x, this.end.y);
                grad.addColorStop(0, `rgba(255,100,100,${this.alpha})`);
                grad.addColorStop(0.5, `rgba(255,200,100,${this.alpha})`);
                grad.addColorStop(1, `rgba(255,100,100,${this.alpha * 0.5})`);
                ctx.strokeStyle = grad; ctx.lineWidth = 6 * this.alpha; ctx.lineCap = 'round';
                ctx.beginPath(); ctx.moveTo(this.start.x, this.start.y); ctx.lineTo(this.end.x, this.end.y); ctx.stroke();
                ctx.fillStyle = `rgba(255,255,200,${this.alpha})`;
                ctx.beginPath(); ctx.arc(this.end.x, this.end.y, 4 * this.alpha, 0, Math.PI*2); ctx.fill();
                ctx.restore();
            }
        }

        class BeamLaser extends Entity {
            constructor(x, y, direction) {
                super(x, y, 0); this.position = new Vector2(x, y); this.lifetime = 500; this.maxLifetime = 500;
                this.width = 70; this.hitEnemies = new Set(); this.direction = direction;
            }
            update(deltaTime) {
                this.lifetime -= deltaTime; this.alpha = this.lifetime / this.maxLifetime;
                if (this.lifetime <= 0) this.markedForDeletion = true;
                if (this.lifetime > 50) {
                    const bounds = camera.getWorldBounds();
                    for (const e of game.entities) {
                        if (e instanceof Enemy && e.state !== 'die' && !this.hitEnemies.has(e)) {
                            const dy = Math.abs(e.position.y - this.position.y);
                            if (dy < this.width / 2 + e.radius) {
                                const inBeam = this.direction === 'left' ? e.position.x <= this.position.x : e.position.x >= this.position.x;
                                if (inBeam && e.position.x >= bounds.left - 50 && e.position.x <= bounds.right + 50) {
                                    e.takeDamage(CONFIG.TRANSFORM_DAMAGE); this.hitEnemies.add(e);
                                    if (game.player) game.player.gainEnergy(CONFIG.ENERGY_PER_HIT * 0.5);
                                    for (let i = 0; i < 8; i++) game.particles.push(new Particle(e.position.x, e.position.y, '#ff4444', 350));
                                }
                            }
                        }
                    }
                    for (const p of game.entities) {
                        if (p instanceof Projectile && !p.markedForDeletion) {
                            const dy = Math.abs((p.position.y - p.arcY) - this.position.y);
                            if (dy < this.width / 2 + p.radius) {
                                const inBeam = this.direction === 'left' ? p.position.x <= this.position.x : p.position.x >= this.position.x;

                let bodyColor, eyeColor, pupilColor, pupilSize, mouthType;
                if (this.transformed) {
                    bodyColor = '#ef4444'; eyeColor = '#fca5a5'; pupilColor = '#7f1d1d'; pupilSize = 6; mouthType = 'grin';
                    ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 30;
                } else if (this.happyFace > 0) {
                    bodyColor = '#f59e0b'; eyeColor = '#fef3c7'; pupilColor = '#78350f'; pupilSize = 4; mouthType = 'smile';
                    ctx.shadowColor = '#fbbf24'; ctx.shadowBlur = 20;
                } else {
                    bodyColor = '#fbbf24'; eyeColor = '#fffbeb'; pupilColor = '#1f2937'; pupilSize = 4; mouthType = 'normal';
                    ctx.shadowBlur = 0;
                }
                const grad = ctx.createRadialGradient(-6, -6, 0, 0, 0, this.radius);
                grad.addColorStop(0, bodyColor); grad.addColorStop(1, this.darkenColor(bodyColor, 35)); ctx.fillStyle = grad;
                ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = this.darkenColor(bodyColor, 55); ctx.lineWidth = 2; ctx.stroke();
                ctx.shadowBlur = 0;
                const aimDir = new Vector2(this.aimX - this.position.x, this.aimY - this.position.y).normalize();
                const px = aimDir.x * 3; const py = aimDir.y * 3;
                ctx.fillStyle = eyeColor; ctx.beginPath(); ctx.arc(-7, -3, 6, 0, Math.PI * 2); ctx.arc(7, -3, 6, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = pupilColor; ctx.beginPath(); ctx.arc(-7 + px, -3 + py, pupilSize, 0, Math.PI * 2); ctx.arc(7 + px, -3 + py, pupilSize, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-7 + px - 1, -3 + py - 1, 1.5, 0, Math.PI * 2); ctx.arc(7 + px - 1, -3 + py - 1, 1.5, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = this.darkenColor(bodyColor, 40); ctx.lineWidth = 2;
                ctx.beginPath();
                if (mouthType === 'grin') { ctx.moveTo(-6, 8); ctx.quadraticCurveTo(0, 14, 6, 8); ctx.moveTo(-6, 8); ctx.lineTo(-6, 10); ctx.lineTo(6, 10); ctx.lineTo(6, 8); }
                else if (mouthType === 'smile') { ctx.moveTo(-5, 6); ctx.quadraticCurveTo(0, 11, 5, 6); }
                else { ctx.moveTo(-4, 8); ctx.quadraticCurveTo(0, 9, 4, 8); }
                ctx.stroke();
                if (this.transformed) { ctx.strokeStyle = '#ff8800'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-18, -8); ctx.lineTo(-24, -2); ctx.moveTo(18, -8); ctx.lineTo(24, -2); ctx.stroke(); }
                ctx.restore();
            }
            darkenColor(color, percent) { const num = parseInt(color.replace('#', ''), 16); const amt = Math.round(2.55 * percent); const R = Math.max((num >> 16) - amt, 0), G = Math.max((num >> 8 & 0x00FF) - amt, 0), B = Math.max((num & 0x0000FF) - amt, 0); return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1); }
        }

        function init() {
            game.canvas = document.getElementById('gameCanvas'); game.ctx = game.canvas.getContext('2d');
            resizeCanvas();
            initEyeTracking();
            bindEvents(); bindInputEvents();
            requestAnimationFrame(gameLoop);
        }

        function initEyeTracking() {
            const statusEl = document.getElementById('permissionStatus');
            try { eyeTracking.init(); statusEl.textContent = '眼动引擎已加载'; }
            catch (e) { statusEl.textContent = '眼动引擎加载失败'; }
        }

        function resizeCanvas() {
            game.canvas.width = window.innerWidth; game.canvas.height = window.innerHeight;
            game.groundY = Math.max(game.canvas.height * 0.65, game.canvas.height - 140);
        }

        function bindEvents() {
            window.addEventListener('resize', () => { resizeCanvas(); if (game.player) camera.update(game.player); });
            document.getElementById('startBtn').addEventListener('click', startGame);
            document.getElementById('restartBtn').addEventListener('click', restartGame);
            document.getElementById('menuBtn').addEventListener('click', backToMenu);
            document.getElementById('allowCameraBtn').addEventListener('click', async () => {
                document.getElementById('permissionStatus').textContent = '正在启动摄像头...';
                const ok = await eyeTracking.start();
                if (!ok) {
                    document.getElementById('permissionOverlay').classList.add('hidden');
                    showToast('已切换为触摸/鼠标控制');
                }
            });
            document.getElementById('denyCameraBtn').addEventListener('click', () => {
                document.getElementById('permissionOverlay').classList.add('hidden');
                showToast('已切换为触摸/鼠标控制');
                updateControlToggle();
            });
            document.getElementById('controlToggle').addEventListener('click', () => {
                if (eyeTracking.active) { eyeTracking.stop(); showToast('已停止眼动追踪'); }
                else if (eyeTracking.checkAvailable()) { eyeTracking.start(); }
            });
        }

        function bindInputEvents() {
            game.canvas.addEventListener('mousemove', e => { input.mouseX = e.offsetX || e.clientX; input.mouseY = e.offsetY || e.clientY; input.hasMouse = true; });
            game.canvas.addEventListener('touchstart', e => { input.hasTouch = true; if (e.touches.length > 0) { input.touchX = e.touches[0].clientX; input.touchY = e.touches[0].clientY; } }, {passive: false});
            game.canvas.addEventListener('touchmove', e => { input.hasTouch = true; if (e.touches.length > 0) { input.touchX = e.touches[0].clientX; input.touchY = e.touches[0].clientY; } e.preventDefault(); }, {passive: false});
            game.canvas.addEventListener('touchend', () => { input.hasTouch = false; });
            game.canvas.addEventListener('touchcancel', () => { input.hasTouch = false; });
        }

        async function startGame() {
            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('hud').style.display = 'flex';
            game.state = GameState.PLAYING; game.score = 0; game.wave = 1;
            game.entities = []; game.particles = [];
            game.player = new Player(game.canvas.width / 2, game.groundY - 22);
            game.entities.push(game.player);
            camera.update(game.player);
            if (eyeTracking.checkAvailable() && !eyeTracking.active && !eyeTracking.ready) {
                document.getElementById('permissionOverlay').classList.remove('hidden');
            } else {
                updateControlToggle();
            }
        }

        function restartGame() {
            document.getElementById('gameOver').classList.remove('show');
            game.state = GameState.PLAYING; game.score = 0; game.wave = 1;
            game.entities = []; game.particles = [];
            game.player = new Player(game.canvas.width / 2, game.groundY - 22);
            game.entities.push(game.player);
            camera.update(game.player); updateUI(); updateControlToggle();
        }

        function backToMenu() {
            document.getElementById('gameOver').classList.remove('show');
            document.getElementById('mainMenu').classList.remove('hidden');
            document.getElementById('hud').style.display = 'none';
            eyeTracking.stop();
            game.state = GameState.MENU;
        }

        function gameOver() {
            game.state = GameState.GAME_OVER;
            document.getElementById('finalScore').textContent = game.score;
            document.getElementById('gameOver').classList.add('show');
            eyeTracking.stop();
        }

        function hasBossAlive() { return game.entities.some(e => e instanceof Boss && e.state !== 'die'); }

        function spawnEnemy() {
            if (game.state !== GameState.PLAYING) return;
            const bounds = camera.getWorldBounds();
            const y = game.groundY - 20;
            const side = Math.random() < 0.5 ? 'left' : 'right';
            const x = side === 'left' ? bounds.left - 30 : bounds.right + 30;
            const type = Math.random() < 0.6 ? 'melee' : 'range';
            game.entities.push(new Enemy(x, y, type));
        }

        function spawnBoss() {
            if (game.state !== GameState.PLAYING) return;
            const bounds = camera.getWorldBounds();
            const x = bounds.left + bounds.right / 2;
            const y = game.groundY - 42;
            game.entities.push(new Boss(x, y));
            showToast('⚠️ Boss 狗头出现！');
        }

        function updateUI() {
            if (!game.player) return;
            const hpPct = Math.max(0, (game.player.health / game.player.maxHealth) * 100);
            const enPct = Math.max(0, (game.player.energy / game.player.maxEnergy) * 100);
            document.getElementById('healthFill').style.width = hpPct + '%';
            document.getElementById('energyFill').style.width = enPct + '%';
            document.getElementById('scoreDisplay').textContent = game.score;
            document.getElementById('waveDisplay').textContent = game.wave;
        }

        function showToast(msg) {
            const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 2000);
        }

        let lastTime = performance.now();
        function gameLoop() {
            const now = performance.now(); const dt = now - lastTime; lastTime = now;
            update(dt); render(); requestAnimationFrame(gameLoop);
        }

        function update(deltaTime) {
            if (game.state !== GameState.PLAYING) return;
            updateInput();
            if (game.player) camera.update(game.player);
            game.enemySpawnTimer += deltaTime; game.waveTimer += deltaTime;
            const spawnInterval = Math.max(600, CONFIG.ENEMY_SPAWN_RATE - game.wave * 120);
            if (game.enemySpawnTimer > spawnInterval) { game.enemySpawnTimer = 0; spawnEnemy(); }
            if (game.waveTimer > 25000 && !game.bossSpawnedThisWave && game.wave % CONFIG.BOSS_SPAWN_WAVE === 0) { spawnBoss(); game.bossSpawnedThisWave = true; }
            else if (game.waveTimer > 30000) { game.wave++; game.waveTimer = 0; game.bossSpawnedThisWave = false; showToast('🌊 波次 ' + game.wave); }
            for (const e of game.entities) e.update(deltaTime);
            for (const p of game.particles) p.update(deltaTime);
            game.entities = game.entities.filter(e => !e.markedForDeletion);
            game.particles = game.particles.filter(p => !p.markedForDeletion);
            updateUI();
        }

        function render() {
            const ctx = game.ctx; const W = game.canvas.width; const H = game.canvas.height;
            ctx.clearRect(0, 0, W, H);
            if (game.state === GameState.MENU) { renderMenuBackground(ctx, W, H); return; }
            renderStaticBackground(ctx, W, H); renderGround(ctx, W, H);
            if (game.player) drawAimLine(ctx, game.player);
            camera.apply(ctx);
            for (const p of game.particles) p.draw(ctx);
            game.entities.sort((a, b) => a.position.y - b.position.y);
            for (const e of game.entities) e.draw(ctx);
            camera.restore(ctx);
            if (game.player && game.player.transformed) {
                ctx.save(); ctx.fillStyle = 'rgba(255,0,0,0.1)'; ctx.fillRect(0, 0, W, H); ctx.restore();
            }
        }

        function renderStaticBackground(ctx, W, H) {
            const grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, '#0f0f23'); grad.addColorStop(1, '#1a1a3e'); ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = 'rgba(255,255,255,0.8)'; for (let i = 0; i < 60; i++) { const x = (i * 137) % W; const y = (i * 89) % (H * 0.6); const r = (i % 3) + 1; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
            const moonX = W * 0.75; const moonY = H * 0.2; ctx.save(); ctx.shadowColor = 'rgba(255,255,200,0.4)'; ctx.shadowBlur = 30; ctx.fillStyle = '#f0e6c8'; ctx.beginPath(); ctx.arc(moonX, moonY, 35, 0, Math.PI * 2); ctx.fill(); ctx.restore();
        }

        function renderGround(ctx, W, H) {
            const groundY = game.groundY;
            ctx.save(); ctx.fillStyle = '#0d0d1a'; ctx.fillRect(0, groundY, W, H - groundY);
            const grad = ctx.createLinearGradient(0, groundY, 0, groundY + 30); grad.addColorStop(0, 'rgba(0,255,255,0.25)'); grad.addColorStop(1, 'rgba(0,255,255,0)'); ctx.fillStyle = grad; ctx.fillRect(0, groundY, W, 30);
            ctx.strokeStyle = 'rgba(0,255,255,0.5)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(W, groundY); ctx.stroke();
            for (let i = 0; i < W + 50; i += 40) { const offset = (Date.now() * 0.02) % 40; const x = i - offset; const h = 8 + Math.sin(i * 0.1) * 4; ctx.fillStyle = 'rgba(0,255,255,0.15)'; ctx.beginPath(); ctx.moveTo(x, groundY); ctx.lineTo(x + 8, groundY - h); ctx.lineTo(x + 16, groundY); ctx.fill(); }
            ctx.restore();
        }

        function drawAimLine(ctx, player) {
            if (!player) return;
            const dx = player.aimX - player.position.x; const dy = player.aimY - player.position.y; const dist = Math.sqrt(dx*dx+dy*dy);
            if (dist === 0) return;
            const dir = new Vector2(dx, dy).normalize(); const maxLen = 2000;
            camera.apply(ctx);
            ctx.save(); ctx.strokeStyle = 'rgba(255,100,100,0.25)'; ctx.setLineDash([6, 8]); ctx.lineDashOffset = -Date.now() / 10; ctx.lineWidth = 2;
            ctx.beginPath(); const startX = player.position.x + (player.facingRight ? player.radius + 2 : -player.radius - 2); const startY = player.position.y - 5;
            let endX = startX + dir.x * maxLen; let endY = startY + dir.y * maxLen;
            for (const e of game.entities) {
                if (e instanceof Enemy && e.state !== 'die') {
                    const hit = player.rayCircleIntersect(new Vector2(startX, startY), dir, e.position, e.radius);
                    if (hit && hit.t < maxLen) { endX = startX + dir.x * hit.t; endY = startY + dir.y * hit.t; }
                }
            }
            ctx.moveTo(startX, startY); ctx.lineTo(endX, endY); ctx.stroke(); ctx.restore();
            camera.restore(ctx);
        }

        function renderMenuBackground(ctx, W, H) {
            const grad = ctx.createLinearGradient(0, 0, 0, H); grad.addColorStop(0, '#0f0f23'); grad.addColorStop(1, '#1a1a3e'); ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = 'rgba(255,255,255,0.9)'; for (let i = 0; i < 80; i++) { const x = (i * 137 + Date.now() * 0.01) % W; const y = (i * 89) % (H * 0.7); const r = (i % 3) + 1; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
            const groundY = H * 0.7; ctx.fillStyle = '#0d0d1a'; ctx.fillRect(0, groundY, W, H - groundY);
            const g = ctx.createLinearGradient(0, groundY, 0, groundY + 30); g.addColorStop(0, 'rgba(0,255,255,0.3)'); g.addColorStop(1, 'rgba(0,255,255,0)'); ctx.fillStyle = g; ctx.fillRect(0, groundY, W, 30);
            ctx.strokeStyle = 'rgba(0,255,255,0.6)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(W, groundY); ctx.stroke();
        }

        init();
    </script>
</body>
</html>
